<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sensey Coffee</title><style>@import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap");

*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:#f3faf5;color:#173324}
header{background:linear-gradient(135deg,#0e4429,#2e9e62);color:#fff;padding:22px 16px;text-align:center}h1{margin:0}header p{margin:4px 0 0;opacity:.85}
main{max-width:760px;margin:auto;padding:16px}.box{background:#fff;border:1px solid #cfe6d6;border-radius:14px;padding:16px;margin-bottom:14px}
input,select,textarea,button{font:inherit;padding:10px 12px;border:1px solid #cfe6d6;border-radius:9px;background:#fff;color:inherit}
input:not([type=checkbox]),select,textarea{width:100%}button{cursor:pointer}.utama{background:#1b6b43;color:#fff;border:0;width:100%;padding:13px;font-weight:700}
button:disabled{opacity:.6}.tab{display:flex;gap:8px;margin-bottom:12px}.tab button{flex:1}.tab .on{background:#1b6b43;color:#fff}
.dua{display:grid;grid-template-columns:1fr 1fr;gap:10px}label.t{display:flex;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid #e8f5ec;cursor:pointer}
label.t input{width:22px;height:22px;accent-color:#1b6b43;flex:none}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.cards .box{margin:0;text-align:center;border-top:5px solid #1b6b43}.cards b{display:block;font-size:30px;color:#0e4429}small{color:#5b7a67}
.bar{height:9px;background:#e8f5ec;border-radius:9px;margin:5px 0 12px}.bar i{display:block;height:100%;background:#2e9e62;border-radius:9px}
table{width:100%;border-collapse:collapse;font-size:14px}th{background:#1b6b43;color:#fff}th,td{padding:8px;text-align:left;border-bottom:1px solid #e8f5ec}
#msg{position:sticky;bottom:10px;text-align:center;padding:11px;border-radius:9px;background:#d9f2e0}#msg:empty{display:none}[hidden]{display:none!important}
main.lebar{max-width:1040px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi div{border-radius:16px;padding:16px;color:#fff;background:linear-gradient(135deg,#0e4429,#1b6b43)}.kpi div:nth-child(2){background:linear-gradient(135deg,#1b6b43,#2e9e62)}
.kpi div:nth-child(3){background:linear-gradient(135deg,#2e9e62,#57bd83)}.kpi div:nth-child(4){background:#fff;color:#b23b32;border:1px solid #f0cfcb}.kpi b{display:block;font-size:34px}
.tiga{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.tiga .box{margin:0;text-align:center}
.cincin{width:110px;height:110px;border-radius:50%;margin:10px auto;display:grid;place-items:center;background:conic-gradient(#2e9e62 calc(var(--p)*1%),#e8f5ec 0)}
.cincin span{width:84px;height:84px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:24px;font-weight:800;color:#0e4429}
.grafik{display:flex;align-items:flex-end;gap:3px;height:150px;border-bottom:2px solid #cfe6d6}.grafik i{flex:1;background:#2e9e62;border-radius:5px 5px 0 0}
.kal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;font-size:12px}.kal div{min-height:58px;border-radius:8px;padding:5px 1px;background:#f3faf5;overflow:hidden}
.kal .h{min-height:0;background:#1b6b43;color:#fff;font-weight:700}.kal .baik{background:#bfe8cb}.kal .cukup{background:#ffe9a8}.kal .kurang{background:#f6c6c2}.kal .kosong{background:none}
h3{margin:0 0 12px;color:#0e4429}.gulir{overflow-x:auto}
@media(max-width:620px){.kpi{grid-template-columns:1fr 1fr}.tiga{grid-template-columns:1fr}}

/* tampilan */
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:radial-gradient(circle at 10% 0,#dff5e6 0,transparent 40%),#f4faf6;min-height:100vh}
header{background:linear-gradient(135deg,#0a3520,#15673f 55%,#34a86a);padding:34px 16px 58px;border-radius:0 0 34px 34px;position:relative;overflow:hidden}
header:before,header:after{content:"";position:absolute;border-radius:50%;background:#ffffff14;width:220px;height:220px;top:-90px;left:-60px}
header:after{top:auto;left:auto;right:-50px;bottom:-130px;width:260px;height:260px}
header .logo{width:70px;height:70px;margin:0 auto 10px;border-radius:22px;background:#fff;display:grid;place-items:center;font-size:36px;box-shadow:0 8px 24px #0004}
h1{font-size:28px;font-weight:800;letter-spacing:.5px}header p{font-size:14px}
main{margin-top:-30px;position:relative}.box{border:1px solid #e0efe5;border-radius:20px;box-shadow:0 8px 24px #0e44290f;padding:18px}
.tab{background:#fff;padding:6px;border-radius:18px;box-shadow:0 10px 28px #0e442922}.tab button{border:0;border-radius:13px;font-weight:600;padding:12px}
.tab .on{background:linear-gradient(135deg,#15673f,#34a86a);box-shadow:0 5px 14px #15673f55}
input:not([type=checkbox]),select,textarea{margin-top:6px;border-radius:12px;background:#f7fcf9}input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid #8fd19e;outline-offset:1px}
label.t{border:1px solid #e0efe5;border-radius:14px;padding:13px;margin-top:8px;transition:.2s}label.t:hover{border-color:#8fd19e}
label.t:has(input:checked){background:#e4f6ea;border-color:#57bd83}
#hitung{display:block;font-size:17px;color:#0e4429}.maju{height:12px;background:#e8f5ec;border-radius:12px;margin:8px 0 6px;overflow:hidden}.maju i{display:block;height:100%;width:0;background:linear-gradient(90deg,#15673f,#57bd83);transition:width .3s}
.utama{border-radius:14px;background:linear-gradient(135deg,#15673f,#34a86a);box-shadow:0 8px 20px #15673f44;font-size:16px}
.kpi div{border-radius:20px;box-shadow:0 8px 20px #0e442920}.kpi b{font-size:38px;font-weight:800}.kpi div{font-size:13px}
.cincin{width:126px;height:126px}.cincin span{width:98px;height:98px}
.nilai{display:inline-block;padding:5px 14px;border-radius:30px;font-size:13px;font-weight:600;background:#eef3f0}.nilai.baik{background:#d3f1dd;color:#0e5a31}.nilai.cukup{background:#fff0bd;color:#755500}.nilai.kurang{background:#fbdbd7;color:#9c261d}
.grafik{height:170px}.grafik i{background:linear-gradient(#57bd83,#15673f)}.bar{height:11px}.bar i{background:linear-gradient(90deg,#15673f,#57bd83)}
.kal div{border-radius:12px}.kal .h{border-radius:10px}th{padding:11px 8px}th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}
#msg{box-shadow:0 8px 24px #0e442933;font-weight:600}footer{text-align:center;color:#6b8a76;font-size:12px;padding:10px 0 24px}
</style></head><body>
<header><div class="logo">☕</div><h1>Sensey Coffee</h1><p>Checklist Pembukaan Harian</p></header>
<main>
<button class="utama" id="masuk" hidden>Coba lagi</button><p></p>
<div id="app" hidden>
<div class="tab"><button id="a" class="on">Isi Checklist</button><button id="b">Dashboard</button></div>
<section id="isi">
<div class="box dua"><div>Tanggal<input type="date" id="tgl"></div><div>Barista<select id="nama"></select></div></div>
<div class="box"><b id="hitung"></b><div class="maju"><i id="maju"></i></div><div id="list"></div><p>Catatan</p><textarea id="cat" rows="2" maxlength="500"></textarea>
<p><small id="info"></small></p><button class="utama" id="kirim">Simpan ke spreadsheet</button></div>
<div class="box"><small>Pra-opening nyalakan 1 AC saja, 2 AC kalau sudah ada customer. Lagu jangan sampai hening. Hasil akan di-crosscheck Supervisor/Manager.</small></div>
</section>
<section id="dash" hidden><div class="box">Bulan<input type="month" id="bln"></div><div id="hasil"></div></section>
</div>
<div id="msg"></div>
<footer>Sensey Coffee · Checklist Pembukaan</footer>
</main>
<script>
const $=id=>document.getElementById(id);let D;
const el=(t,x,c)=>{const e=document.createElement(t);if(x!=null)e.textContent=x;if(c)e.className=c;return e};
const tglID=s=>new Date(s+"T00:00:00").toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const pesan=t=>$("msg").textContent=t||"";
// Alamat Web App Apps Script
const API="https://script.google.com/macros/s/AKfycbyB2r3AQLFw-TmjzeUr5zwwkvhPsheoFsjQhaL0dloqnedvSuY-RZ853JtzKWWVWVZR/exec";
async function panggil(isiPermintaan,ok){pesan("Memproses…");const tombol=document.querySelectorAll(".utama");tombol.forEach(b=>b.disabled=true);
 const batal=new AbortController(),waktu=setTimeout(()=>batal.abort(),45000);
 try{
  // tanpa header Content-Type supaya tidak kena blokir CORS
  const res=await fetch(API,{method:"POST",body:JSON.stringify({...isiPermintaan}),signal:batal.signal});
  const r=await res.json();if(r.error)throw new Error(r.message||r.error);pesan();ok(r);
 }catch(e){
  pesan(e.name==="AbortError"?"Server tidak menjawab. Coba lagi.":e instanceof TypeError||e instanceof SyntaxError?"Tidak bisa terhubung. Cek internet dan akses deployment harus \"Siapa saja\".":e.message);
   if(!D)$("masuk").hidden=false;
 }finally{clearTimeout(waktu);tombol.forEach(b=>b.disabled=false)}}
function mulai(){$("masuk").hidden=true;panggil({action:"get"},r=>{D=r;$("masuk").hidden=true;$("app").hidden=false;
 $("nama").replaceChildren(new Option("- pilih -",""),...D.barista.map(n=>new Option(n)));
 $("list").replaceChildren(...D.tugas.map((t,i)=>{const l=el("label",null,"t"),c=el("input");c.type="checkbox";c.onchange=hitung;l.append(c,el("span",(i+1)+". "+t));return l}));
 $("tgl").value=D.hariIni;$("bln").value=D.hariIni.slice(0,7);muat();dash()})}
$("masuk").onclick=mulai;
const kotak=()=>[...$("list").querySelectorAll("input")];
function hitung(){const n=kotak().filter(c=>c.checked).length;$("hitung").textContent=n+" dari "+D.tugas.length+" tugas selesai";$("maju").style.width=n/D.tugas.length*100+"%"}
function muat(){const d=D.data.find(x=>x.tgl===$("tgl").value);
 $("nama").value=d?d.barista:"";kotak().forEach((c,i)=>c.checked=!!d&&d.cek[i]==="✓");$("cat").value=d?d.catatan:"";
 $("info").textContent=!d?"Tanggal ini belum tersedia di spreadsheet.":d.barista?tglID(d.tgl)+" sudah diisi "+d.barista+". Menyimpan akan menimpa isian itu.":tglID(d.tgl)+" belum diisi.";hitung()}
$("tgl").onchange=muat;
$("kirim").onclick=()=>{if(!$("nama").value)return pesan("Pilih nama barista dulu.");
 panggil({action:"update",isi:{tgl:$("tgl").value,barista:$("nama").value,cek:kotak().map(c=>c.checked),catatan:$("cat").value}},r=>{D=r;muat();dash();pesan("Tersimpan ✓");setTimeout(pesan,2500)})};
function dash(){const n=D.tugas.length,bln=$("bln").value,rows=D.data.filter(d=>d.barista&&d.tgl.startsWith(bln));
 const ok=d=>d.cek.filter(v=>v==="✓").length,skor=l=>l.length?Math.round(l.reduce((s,d)=>s+ok(d),0)/(l.length*n)*100):null,pc=v=>v===null?"-":v+"%";
 const kelas=v=>v>=90?"baik":v>=75?"cukup":"kurang",box=judul=>{const x=el("div",null,"box");x.append(el("h3",judul));return x};
 const kpi=el("div",null,"kpi");
 [["Hari terisi",rows.length],["Rata-rata skor",pc(skor(rows))],["Hari sempurna",rows.filter(d=>ok(d)===n).length],["Tugas terlewat",rows.reduce((s,d)=>s+n-ok(d),0)]].forEach(([a,v])=>{const c=el("div",a);c.append(el("b",v));kpi.append(c)});
 const tim=D.barista.map(b=>{const l=rows.filter(d=>d.barista===b);return{b,l,p:skor(l)}});
 const tiga=el("div",null,"tiga");
 tim.forEach(t=>{const c=box(t.b),r=el("div",null,"cincin"),h=t.l.length;r.style.setProperty("--p",t.p||0);r.append(el("span",pc(t.p)));
  c.append(r,el("span",!h?"Belum ada data":t.p>=90?"★ Sangat baik":t.p>=75?"Cukup":"Perlu perhatian","nilai "+(h?kelas(t.p):"")),el("br"),el("small",h+" hari tugas · "+t.l.filter(d=>ok(d)===n).length+" sempurna"));tiga.append(c)});
 const [y,m]=bln.split("-").map(Number),hari=y?new Date(y,m,0).getDate():0;
 const tren=box("Tren skor harian"),g=el("div",null,"grafik"),kal=box("Kalender skor"),k=el("div",null,"kal");
 ["Sen","Sel","Rab","Kam","Jum","Sab","Min"].forEach(x=>k.append(el("div",x,"h")));
 for(let i=0;i<(y?(new Date(y,m-1,1).getDay()+6)%7:0);i++)k.append(el("div",null,"kosong"));
 for(let i=1;i<=hari;i++){const d=rows.find(r=>r.tgl===bln+"-"+String(i).padStart(2,"0")),p=d?skor([d]):null;
  const batang=el("i");batang.style.height=(p||0)+"%";batang.title=i+": "+pc(p);g.append(batang);
  const c=el("div",null,d?kelas(p):"");c.append(el("b",i));if(d)c.append(el("div",d.barista),el("span",p+"%"));
  c.lastChild.style&&d&&(c.children[1].style.cssText="min-height:0;padding:0;background:none");k.append(c)}
 const ket=el("small","Warna kalender: hijau 90% ke atas, kuning 75-89%, merah di bawah 75%.");
 tren.append(g,el("small","Tiap batang satu hari, dari tanggal 1 sampai "+hari+"."));kal.append(k,ket);
 const tugas=box("Kepatuhan per tugas (terendah di atas)");
 D.tugas.map((t,i)=>({t,p:rows.length?Math.round(rows.filter(d=>d.cek[i]==="✓").length/rows.length*100):null})).sort((a,b)=>a.p-b.p).forEach(({t,p})=>{const bar=el("div",null,"bar"),f=el("i");f.style.width=(p||0)+"%";bar.append(f);tugas.append(el("div",t+" · "+pc(p)),bar)});
 const r=box("Rekap harian"),w=el("div",null,"gulir"),tb=el("table");w.append(tb);r.append(w);
 const tr=(v,t)=>{const x=el("tr");v.forEach(s=>x.append(el(t,s)));tb.append(x)};
 tr(["Tanggal","Barista","Skor","Catatan","Crosscheck"],"th");rows.forEach(d=>tr([tglID(d.tgl),d.barista,pc(skor([d])),d.catatan||"-",d.spv||"-"],"td"));
 $("hasil").replaceChildren(kpi,tiga,tren,kal,tugas,r)}
$("bln").onchange=dash;
function tab(x){document.querySelector("main").classList.toggle("lebar",x);$("isi").hidden=x;$("dash").hidden=!x;$("a").classList.toggle("on",!x);$("b").classList.toggle("on",x)}
$("a").onclick=()=>tab(false);$("b").onclick=()=>tab(true);
mulai();
</script></body></html>
